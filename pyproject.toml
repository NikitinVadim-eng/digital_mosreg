[project]
name = "digital-mosreg"
version = "0.1.0"
description = "Парсер каталога ИИ-решений портала Цифровой регион (Streamlit UI)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2",
    "streamlit>=1.40",
]

[project.scripts]
digital-mosreg = "digital_mosreg.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["digital_mosreg"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
